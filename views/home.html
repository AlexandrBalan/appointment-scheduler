<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel ="stylesheet" href = "/styles/style.css">
    </title></title>
</head>
<body>
    <main class="container">
        <section class="contact-section">
            <h1>Appointment Scheduler</h1>


            <h2>Book an Appointment</h2>
            <form action="/contact" method="POST" class="contact-form">
                
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="Jane" required>
                    <span class="err" id="err-firstName">Please enter your first name.</span>
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Doe" required>
                    <span class="err" id="err-lastName">Please enter your last name.</span >
                </div>

                <div class="form-group">
                    <label for="meetingDate">Meeting Date</label>
                    <input type="date" id="meetingDate" name="meetingDate" required>
                </div>

                <div class="meeting-time">
                    <label for="meetingTime">Meeting Time</label >
                    <input type="time" id="meetingTime" name="meetingTime" required>
                </div>

                <div class="form-group full-width">
                    <button type="submit" class="btn-submit">Book Appointment</button>
                </div>

            </form>
        </section>
    </main>
</body>
</html>
